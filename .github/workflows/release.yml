name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --profile dist --locked -p nextcloud-cli
      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          host="$(rustc -vV | awk '/host:/ { print $2 }')"
          name="nextcloud-cli-${version}-${host}"
          mkdir -p "dist/${name}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp target/dist/nextcloud-cli.exe "dist/${name}/nextcloud-cli.exe"
            cp target/dist/nxc.exe "dist/${name}/nxc.exe"
          else
            cp target/dist/nextcloud-cli "dist/${name}/nextcloud-cli"
            cp target/dist/nxc "dist/${name}/nxc"
          fi
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          fi
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
