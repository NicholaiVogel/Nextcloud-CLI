[workspace]
members = ["crates/nextcloud", "crates/nextcloud-index", "crates/nextcloud-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/NicholaiVogel/Nextcloud-CLI"
homepage = "https://github.com/NicholaiVogel/Nextcloud-CLI"
authors = ["Nicholai Vogel"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rcgen = "0.14"
quick-xml = "0.38"
percent-encoding = "2.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
webbrowser = "1.0"
zeroize = { version = "1.8", features = ["derive"] }

[profile.dist]
inherits = "release"
lto = "thin"
